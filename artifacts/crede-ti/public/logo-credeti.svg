<svg width="640" height="360" viewBox="0 0 640 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2978D9"/>
      <stop offset="1" stop-color="#1B5FBC"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="32" fill="url(#bg)"/>

  <!-- Tagline -->
  <text x="320" y="86" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="22" font-weight="400" fill="rgba(255,255,255,0.92)"
        font-style="italic">
    "Más que un crédito, una forma distinta de vivir."
  </text>

  <!-- Brand mark in gold oval -->
  <ellipse cx="320" cy="190" rx="240" ry="62" stroke="#E6A82E" stroke-width="8" fill="none"/>
  <text x="320" y="214" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="84" font-weight="700" fill="#ffffff"
        letter-spacing="-1">Crede-Ti</text>

  <!-- Underline + slogan -->
  <text x="320" y="290" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="34" font-weight="600" fill="#ffffff"
        letter-spacing="0.5">Creemos en ti</text>
  <path d="M150 308 Q320 332 490 308" stroke="#E6A82E" stroke-width="6" stroke-linecap="round" fill="none"/>
</svg>
